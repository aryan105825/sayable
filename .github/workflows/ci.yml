name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip check
      - name: Unit tests
        run: pytest -q
      - name: Offline verification (servers on localhost, no secrets, no internet needed)
        run: bash scripts/verify.sh --fast
      - name: Keep the measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-results
          path: |
            results/verify_summary.json
            results/lint_*.json
            results/lint_*.html
            results/safety.json
          if-no-files-found: ignore
